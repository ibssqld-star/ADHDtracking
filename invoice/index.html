  ${warnings.length ? `<div class="banner no-print"><div class="small">${warnings.join('<br>')}</div></div>` : ''}
  <div class="paper-wrap">${paperHtml(d)}</div>
  ${!isQ && d.payments.length ? `<div class="card mt no-print"><h2>Payments</h2>${d.payments.map(p => `<div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><span>${auDate(p.date)}</span><span class="muted">${esc(p.method)}</span><b class="right">${money(toCents(p.amount))}</b><button class="icon-btn" title="Remove payment" data-act="pay-del" data-id="${p.id}">${I.x}</button></div>`).join('')}<div class="row" style="padding-top:8px;border-top:1px solid var(--line)"><b>Balance</b><b class="right">${money(t.balance)}</b></div></div>` : ''}
  ${d.fromQuote ? `<div class="muted small mt no-print">Created from quote ${esc(d.fromQuote)}.</div>` : ''}`;
}

function paperHtml(d) {
  const st = S.settings, c = getClient(d.clientId) || {};
  const isQ = d.type === 'quote', t = totals(d), s = status(d);
  const title = isQ ? 'Quote' : (d.gstReg ? 'Tax Invoice' : 'Invoice');
  const ref = d.number;
  const priceCol = d.gstReg ? (d.incGst ? 'inc GST' : 'ex GST') : '';
  const bizLines = [
    st.tradingName && st.businessName && st.tradingName !== st.businessName ? `Trading as ${esc(st.tradingName)}` : '',
    st.abn ? `<b>ABN ${esc(abnFmt(st.abn))}</b>` : '',
    st.licence ? `Licence ${esc(st.licence)}` : '',
    st.address ? nl2br(st.address) : '',
    [st.phone, st.email].filter(Boolean).map(esc).join(' · ')
  ].filter(Boolean).join('<br>');
  const rows = d.lines.filter(l => l.desc || num(l.price)).map(l => `
    <tr><td>${esc(l.desc) || '<span style="color:#999">—</span>'}${d.gstReg && !l.gst ? ' <span class="free">(GST-free)</span>' : ''}</td>
    <td class="n">${esc(String(num(l.qty)))} ${esc(l.unit)}</td><td class="n">${money(toCents(l.price))}</td><td class="n">${money(lineCents(l))}</td></tr>`).join('');
  let totalsRows;
  if (!d.gstReg) totalsRows = `<div class="grand"><span>Total</span><span>${money(t.total)}</span></div>`;
  else totalsRows = `<div><span>Subtotal (ex GST)</span><span>${money(t.sub)}</span></div>
      <div><span>GST</span><span>${money(t.gst)}</span></div>
      <div class="grand"><span>Total inc GST</span><span>${money(t.total)}</span></div>`;
  if (!isQ && t.paid > 0) totalsRows += `<div><span>Paid</span><span>-${money(t.paid)}</span></div><div class="due"><span>Balance due</span><span>${money(t.balance)}</span></div>`;

  const payRows = [
    st.accountName ? `<tr><td>Account name</td><td><b>${esc(st.accountName)}</b></td></tr>` : '',
    st.bsb ? `<tr><td>BSB</td><td><b>${esc(bsbFmt(st.bsb))}</b></td></tr>` : '',
    st.accountNumber ? `<tr><td>Account no.</td><td><b>${esc(st.accountNumber)}</b></td></tr>` : '',
    st.payId ? `<tr><td>PayID</td><td><b>${esc(st.payId)}</b></td></tr>` : '',
    `<tr><td>Reference</td><td><b>${esc(ref)}</b></td></tr>`
  ].join('');

  return `<article class="paper">
    <div class="p-head">
      <div>
        ${st.logo ? `<img class="logo" src="${st.logo}" alt="">` : ''}
        <div class="bizname">${esc(st.businessName || 'Your Business Name')}</div>
        <div>${bizLines}</div>
      </div>
      <div>
        <div class="doc-title">${title}</div>
        <table class="meta">
          <tr><td>${isQ ? 'Quote' : 'Invoice'} no.</td><td><b>${esc(d.number)}</b></td></tr>
          <tr><td>Date</td><td>${auDate(d.issueDate)}</td></tr>
          <tr><td>${isQ ? 'Valid until' : 'Due'}</td><td><b>${d.dueDate === d.issueDate && !isQ ? 'On receipt' : auDate(d.dueDate)}</b></td></tr>
          ${d.reference ? `<tr><td>Your ref</td><td>${esc(d.reference)}</td></tr>` : ''}
        </table>
      </div>
    </div>
    <div class="parties">
      <div><div class="lbl">${isQ ? 'Prepared for' : 'Bill to'}</div>
        <b>${esc(c.name || '—')}</b>${c.contact ? `<br>Attn: ${esc(c.contact)}` : ''}${c.address ? `<br>${nl2br(c.address)}` : ''}${c.abn ? `<br>ABN ${esc(abnFmt(c.abn))}` : ''}
      </div>
      ${d.site ? `<div><div class="lbl">Job site</div>${nl2br(d.site)}</div>` : ''}
    </div>
    <table class="items">
      <thead><tr><th>Description</th><th class="n">Qty</th><th class="n">Unit price${priceCol ? ' ' + priceCol : ''}</th><th class="n">Amount</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4" style="color:#999">No items</td></tr>'}</tbody>
    </table>
    <div class="totrow">${!isQ && s === 'paid' ? '<div class="stamp">PAID</div>' : !isQ && s === 'overdue' ? '<div class="stamp over">OVERDUE</div>' : '<span></span>'}<div class="ptotals">${totalsRows}</div></div>
    ${!isQ && d.gstReg && t.hasFree ? '<div class="free" style="text-align:right;margin-top:4px">Items marked GST-free have no GST included.</div>' : ''}
    ${!d.gstReg ? '<div class="free" style="text-align:right;margin-top:4px">No GST has been charged. Supplier is not registered for GST.</div>' : ''}
    ${d.notes ? `<div class="notes"><div class="lbl">Notes</div>${esc(d.notes)}</div>` : ''}
    ${isQ
      ? `<div class="pay"><div><div class="lbl">To accept</div>Reply to this quote or sign below. This quote is valid until ${auDate(d.dueDate)}.</div></div>
         <div class="sign"><div>Signed</div><div>Name</div><div>Date</div></div>`
      : `<div class="pay"><div><div class="lbl">How to pay</div><table>${payRows}</table></div>
         <div><div class="lbl">Amount due</div><div style="font-size:22px;font-weight:800">${money(t.balance)}</div><div>${d.dueDate === d.issueDate ? 'Due on receipt' : 'by ' + longDate(d.dueDate)}</div></div></div>`}
    ${st.footerNote ? `<div class="foot">${esc(st.footerNote)}</div>` : ''}
  </article>`;
}

/* ---------- modal ---------- */
function openModal(title, body, submitLabel, onSubmit) {
  const m = document.getElementById('modal');
  m.innerHTML = `<form method="dialog"><h2>${title}</h2>${body}<div class="actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">${submitLabel}</button></div></form>`;
  const form = m.querySelector('form');
  form.addEventListener('submit', e => {
    if (e.submitter && e.submitter.value === 'cancel') return;
    e.preventDefault();
    if (!form.reportValidity()) return;
    const data = Object.fromEntries(new FormData(form).entries());
    if (onSubmit(data, form) !== false) m.close();
  });
  m.showModal();
  const first = form.querySelector('input,select,textarea'); if (first) first.focus();
  return m;
}
// In-page confirmation (browser confirm()/prompt() are blocked in some viewers)
function ask(title, message, okLabel, onOk, typeWord) {
  openModal(esc(title), `<p style="margin:0">${message}</p>${typeWord ? `<label class="f mt">Type ${typeWord} to confirm<input class="inp" name="word" id="ask-word" autocomplete="off" required></label>` : ''}`,
    okLabel, data => {
      if (typeWord && String(data.word || '').trim().toUpperCase() !== typeWord) { toast(`Type ${typeWord} in the box to go ahead.`); return false; }
      setTimeout(onOk, 0);
    });
  const ok = document.querySelector('#modal button[value=ok]');
  ok.style.background = 'var(--bad)'; ok.style.borderColor = 'var(--bad)'; ok.style.color = '#fff';
}
function copyText(text, el) {
  const done = () => toast('Copied. Ready to paste.');
  try {
    navigator.clipboard.writeText(text).then(done, () => { if (el) { el.focus(); el.select(); } toast('Press and hold the text to copy it.'); });
  } catch (e) { if (el) { el.focus(); el.select(); } toast('Press and hold the text to copy it.'); }
}
// Show text the person can copy (used where downloads or mail links are blocked)
function showCopy(title, intro, blocks) {
  const m = openModal(esc(title), `<p class="muted small" style="margin:0">${intro}</p>` + blocks.map((b, i) => `
    <div class="copybox"><div class="row"><b class="small">${esc(b.label)}</b><button type="button" class="btn sm" data-copy="${i}">Copy</button></div>
    ${b.multi ? `<textarea class="inp" id="copy-${i}" readonly>${esc(b.text)}</textarea>` : `<input class="inp" id="copy-${i}" readonly value="${esc(b.text)}">`}</div>`).join(''), 'Done', () => {});
  m.querySelector('button[value=cancel]').classList.add('hide');
  m.querySelectorAll('[data-copy]').forEach(btn => btn.addEventListener('click', () => { const i = btn.dataset.copy; copyText(blocks[i].text, document.getElementById('copy-' + i)); }));
}
const EMBEDDED = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

function clientModal(onDone) {
  openModal('New client', clientFields(), 'Add client', data => {
    const c = { id: uid(), name: data.name.trim(), contact: data.contact.trim(), email: data.email.trim(), phone: data.phone.trim(), address: data.address.trim(), abn: abnClean(data.abn) };
    if (c.abn && !abnValid(c.abn)) { toast('That ABN doesn’t look quite right. Check the digits, or leave it blank.'); return false; }
    S.clients.push(c); save(); toast('All set. Client added.');
    onDone && onDone(c);
  });
}

const ACT = {

  },

      S.clients = S.clients.filter(c => c.id !== ds.id); save(); go('/clients'); toast('Done. Client deleted.');

  },

  'line-add'() { const d = getDoc(current.id); dropBlankLines(d); const l = blankLine(); d.lines.push(l); save(); refreshWork(d); ACT['line-edit']({ id: l.id }, null, null, true); },
  'line-edit'(ds, el, e, isNew) {
    const d = getDoc(current.id), l = d.lines.find(x => x.id === ds.id); if (!l) return;
    const m = openModal(isNew ? 'New item' : 'Edit item', lineEditorHtml(l, d), 'Done', () => {});
    m.querySelector('button[value=cancel]').classList.add('hide');
    m.addEventListener('close', () => { const dd = getDoc(current.id); if (dd) { dropBlankLines(dd); save(); refreshWork(dd); } }, { once: true });

  },
  'line-del'(ds) {
    const md = document.getElementById('modal'); if (md.open) md.close();

    const [gone] = d.lines.splice(i, 1);
    save(); refreshWork(d);
    if (gone.desc || num(gone.price)) toast('Line removed', () => {
      const dd = getDoc(d.id); if (!dd) return;
      dd.lines.splice(Math.min(i, dd.lines.length), 0, gone); save();

  },
  qty(ds) {

    if (v === 0) { const m = document.getElementById('modal'); if (m.open) m.close(); return ACT['line-del']({ id: l.id }); }

  picker() {

  'lib-add'(ds) {
    const d = getDoc(current.id), it = libItems().find(i => i.id === ds.id); if (!it) return;
    dropBlankLines(d);
    const have = d.lines.find(l => l.lib === it.id);
    let msg;
    if (have) { have.qty = String(num(have.qty) + 1); msg = `${it.desc} ×${have.qty}`; }
    else { d.lines.push(blankLine({ desc: it.desc, unit: it.unit, price: priceForDoc(it, d), gst: it.gst, lib: it.id })); msg = `Added ${it.desc}`; }
    save();
    const foot = document.getElementById('mfoot');
    if (foot) { pickerMsg = msg; foot.innerHTML = pickerFoot(d); document.getElementById('tiles').innerHTML = tilesHtml(d); }
    else { toast(msg); refreshWork(d); }
  },
  'line-save'(ds) {
    const d = getDoc(current.id), l = d.lines.find(x => x.id === ds.id); if (!l) return;
    const ms = document.getElementById('m-save');
    if (l.lib) { if (ms) ms.textContent = '★ In your list'; return toast('Already in your list'); }
    if (!l.desc || !num(l.price)) { if (ms) ms.textContent = 'Add a name and price first'; return toast('Add what it is and a price, then tap ☆ again.'); }
    const kind = l.unit === 'hr' ? 'labour' : /call.?out|fee|permit|travel|disposal/i.test(l.desc) ? 'fee' : l.unit === 'lot' ? 'job' : 'material';
    let price = num(l.price);
    if (d.gstReg && l.gst && d.incGst !== !!S.settings.pricesIncGst) price = S.settings.pricesIncGst ? price * 1.1 : price / 1.1;
    const it = { id: uid(), kind, desc: l.desc.trim(), unit: l.unit, price: price.toFixed(2), gst: !!l.gst };
    S.items.push(it); l.lib = it.id; save(); refreshWork(d);
    if (ms) ms.textContent = `★ Saved to ${KINDS.find(k => k[0] === kind)[1]}`;

  'new-client'() { const d = getDoc(current.id); clientModal(c => { d.clientId = c.id; save(); refreshWho(d); }); },
  'from-quote'(ds) {
    const d = getDoc(current.id), q = getDoc(ds.id); if (!q) return;
    const before = { lines: d.lines, clientId: d.clientId, site: d.site, notes: d.notes, fromQuote: d.fromQuote, incGst: d.incGst };

    d.clientId = q.clientId; d.site = d.site || q.site; d.notes = d.notes || q.notes; d.fromQuote = q.number; d.incGst = q.incGst;

  charge(ds) { S.settings.chargeBy = ds.val; save(); route(); toast(ds.val === 'job' ? 'Set to fixed price per job' : 'Set to charge by the hour'); },
  display(ds) { S.settings.display = ds.val; save(); route(); },

  'settings-done'() { go('/settings'); toast('All set. Saved.'); },
  font(ds) { S.settings.font = ds.val; save(); route(); },
  quick() {
    const st = S.settings, gstNote = st.gstRegistered ? (st.pricesIncGst ? ' (inc GST)' : ' (ex GST)') : '';
    let rate = num(st.defaultRate);
    if (st.gstRegistered && st.pricesIncGst) rate = Math.round(rate * 110) / 100;
    const mode0 = st.chargeBy === 'job' ? 'job' : 'hour';
    const opts = S.clients.slice().sort((a, b) => a.name.localeCompare(b.name)).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
    const m = openModal('Log a job', `
      <label class="f">What did you do?<textarea class="inp" name="what" id="q-what" rows="2" required placeholder="e.g. Replaced hot water system"></textarea></label>
      <div class="grid g2 mt">

      <div class="grid g2 mt" id="q-hourly" ${mode0 === 'hour' ? '' : 'hidden'}>
        <label class="f">Hours on site<input class="inp" name="hours" id="q-hours" inputmode="decimal" placeholder="e.g. 2.5"></label>

      </div>

        <label class="f">Materials $${gstNote}<input class="inp" name="mat" id="q-mat" inputmode="decimal" placeholder="0"></label>

      else lines.push(blankLine({ desc: what }));
      if (num(data.mat)) lines.push(blankLine({ desc: 'Materials', qty: '1', unit: 'lot', price: num(data.mat).toFixed(2) }));

    f.addEventListener('input', calc);
  },
  async text() {

function celebrate() {
  if (!S.settings.celebrate || S.settings.calm || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.createElement('canvas'); cv.id = 'fx'; document.body.appendChild(cv);
  const W = innerWidth, H = innerHeight, dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const cols = ['#ffb627', 'var(--hv)', '#43e2a3', '#ffffff'];
  const ps = Array.from({ length: 110 }, () => ({ x: W / 2, y: H * .42, vx: (Math.random() - .5) * 15, vy: -Math.random() * 13 - 3, s: Math.random() * 7 + 3, c: cols[Math.random() * 4 | 0], r: Math.random() * 6, vr: (Math.random() - .5) * .4 }));
  let f = 0;
  (function frame() {
    f++; g.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.vy += .38; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.globalAlpha = Math.max(0, 1 - f / 90); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore();
    }
    if (f < 90) requestAnimationFrame(frame); else cv.remove();
  })();
}

document.addEventListener('input', e => {

  if (!b) return;
  const val = t.type === 'checkbox' ? t.checked : t.value;

  if (b === 'set') {
    flashSaved();
    const k = t.dataset.key;
    let v = val;
    if (k === 'abn') v = abnClean(val);
    if (k === 'nextInvoice' || k === 'nextQuote') v = Math.max(1, parseInt(val, 10) || 1);
    if (k === 'paymentTermsDays' || k === 'quoteValidDays') v = Math.max(0, parseInt(val, 10) || 0);
    S.settings[k] = v; save();
    if (k === 'abn') updateAbnHint(t);
    if (t.type === 'checkbox') route();
    if (k === 'monthlyGoal') S.settings.monthlyGoal = String(num(val));
    return;
  }
  if (b === 'search') { listFilter.q = val; refreshPages(); return; }
  if (b === 'clsearch') { clQuery = val; const list = clientList(); if (!list.some(c => c.id === clientSel)) clientSel = list[0] ? list[0].id : null; document.getElementById('cbody').innerHTML = clientsBody(list); setupClientPager(); return; }
  if (b === 'libsearch') { libQuery = val; const d0 = getDoc(current.id); document.getElementById('tiles').innerHTML = tilesHtml(d0); return; }
  if (b === 'csearch') { clientQuery = val; const d0 = getDoc(current.id); document.getElementById('cgrid').innerHTML = clientCardsHtml(d0); syncEditUI(d0); return; }

  const d = getDoc(current.id);
  if (!d) return;
  if (b === 'doc') {
    const k = t.dataset.key;
    if (k === 'clientId' && val === '__new') {
      t.value = d.clientId;
      clientModal(c => { d.clientId = c.id; save(); refreshWho(d); });

    if (k === 'dueDate') { d.terms = null; document.querySelectorAll('#terms button').forEach(x => x.classList.remove('on')); }

  }

  if (!act || !t.files || !t.files[0]) return;
  const file = t.files[0];
  if (act === 'logo') {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 400 / img.width, 160 / img.height);
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      S.settings.logo = cv.toDataURL('image/png'); save(); route(); toast('All set. Logo saved.');
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => toast('That image didn’t load. Try a JPG or PNG.');
    img.src = URL.createObjectURL(file);
  }
  if (act === 'restore') {
    file.text().then(txt => {
      const data = JSON.parse(txt);
      if (!data.settings || !Array.isArray(data.docs)) throw new Error('bad');
      ask('Restore backup?', `It has ${data.docs.length} documents and ${(data.clients || []).length} clients, and replaces what’s on this device.`, 'Restore', () => {
        S = migrate(data); save(); go('/'); toast('All set. Backup restored.');
      });
    }).catch(() => toast('That file doesn’t look like a Docket backup. Try the one from “Download backup”.'));
  }
  t.value = '';
});

    l: d.lines.filter(l => l.desc || num(l.price)).map(l => [l.desc, String(num(l.qty)), l.unit, String(num(l.price)), l.gst ? 1 : 0])
  };
  const raw = new TextEncoder().encode(JSON.stringify(D));
  let frag;
  try {
    const z = new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    frag = 'z.' + b64url(new Uint8Array(await new Response(z).arrayBuffer()));
  } catch (e) { frag = 'j.' + b64url(raw); }
  return clientBase() + '#' + frag;
}
