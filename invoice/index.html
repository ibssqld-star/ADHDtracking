<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090e1b">
<title>Docket Invoicing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: instrument rail (left) + one calm work column. "Night blueprint" HUD:
   hi-vis amber = the one thing to press, cyan = readouts, clipped-corner panels on a blueprint grid. */
:root{
  --bg:#030508; --bg-2:#080c14; --panel:#0a0f19; --panel-2:#101726; --line:#1d2a40; --line-2:#2c3d5c;
  --ink:#eef3ff; --ink-2:#9aa7c7; --ink-3:#6c7898;
  --hv:#ffc21a; --hv-hover:#ffd257; --hv-ink:#1b1200; --hv-soft:rgba(255,194,26,.13); --hv-text:var(--hv);
  --cy:#5ad8ff; --cy-soft:rgba(90,216,255,.12);
  --ok:#43e2a3; --ok-soft:rgba(67,226,163,.13);
  --warn:#ff9a4d; --warn-soft:rgba(255,154,77,.14);
  --bad:#ff6680; --bad-soft:rgba(255,102,128,.14);
  --muted-soft:rgba(154,167,199,.12);
  --grid:rgba(90,216,255,.06); --halo:rgba(90,216,255,.10);
  --glow:0 0 0 1px rgba(90,216,255,.22),0 0 30px rgba(90,216,255,.09);
  --hv-glow:0 0 0 1px color-mix(in srgb,var(--hv) 55%,transparent),0 0 26px color-mix(in srgb,var(--hv) 30%,transparent);
  --nav:#020306; --nav-ink:#c4cee6;
  --f-display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs:16px; --cut:14px; --radius:4px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#edf1f8; --bg-2:#e4eaf4; --panel:#ffffff; --panel-2:#f4f7fc; --line:#d2dbea; --line-2:#b7c4dc;
    --ink:#0c1426; --ink-2:#47557a; --ink-3:#6c7898;
    --hv:#ffb020; --hv-hover:#ffbf45; --hv-ink:#1b1200; --hv-soft:color-mix(in srgb,var(--hv) 16%,transparent); --hv-text:color-mix(in srgb,var(--hv) 45%,#000);
    --cy:#006f9e; --cy-soft:rgba(0,111,158,.09);
    --ok:#08805a; --ok-soft:rgba(8,128,90,.1);
    --warn:#b45400; --warn-soft:rgba(180,84,0,.1);
    --bad:#c8213f; --bad-soft:rgba(200,33,63,.09);
    --muted-soft:rgba(71,85,122,.09);
    --grid:rgba(0,90,140,.07); --halo:rgba(0,111,158,.07);
    --glow:0 0 0 1px rgba(0,111,158,.18),0 6px 24px rgba(12,20,38,.07);
    --hv-glow:0 0 0 1px color-mix(in srgb,var(--hv) 60%,#000),0 6px 22px color-mix(in srgb,var(--hv) 25%,transparent);
    --nav:#0c1426; --nav-ink:#c4cee6;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#edf1f8; --bg-2:#e4eaf4; --panel:#ffffff; --panel-2:#f4f7fc; --line:#d2dbea; --line-2:#b7c4dc;
  --ink:#0c1426; --ink-2:#47557a; --ink-3:#6c7898;
  --hv:#ffb020; --hv-hover:#ffbf45; --hv-ink:#1b1200; --hv-soft:color-mix(in srgb,var(--hv) 16%,transparent); --hv-text:color-mix(in srgb,var(--hv) 45%,#000);
  --cy:#006f9e; --cy-soft:rgba(0,111,158,.09);
  --ok:#08805a; --ok-soft:rgba(8,128,90,.1);
  --warn:#b45400; --warn-soft:rgba(180,84,0,.1);
  --bad:#c8213f; --bad-soft:rgba(200,33,63,.09);
  --muted-soft:rgba(71,85,122,.09);
  --grid:rgba(0,90,140,.07); --halo:rgba(0,111,158,.07);
  --glow:0 0 0 1px rgba(0,111,158,.18),0 6px 24px rgba(12,20,38,.07);
  --hv-glow:0 0 0 1px color-mix(in srgb,var(--hv) 60%,#000),0 6px 22px color-mix(in srgb,var(--hv) 25%,transparent);
  --nav:#0c1426; --nav-ink:#c4cee6;
  color-scheme:light;
}
:root[data-big]{--fs:18px}
:root[data-accent="cyan"]{--hv:#22e4ff;--hv-hover:#6aeeff;--hv-ink:#001a20}
:root[data-accent="pink"]{--hv:#ff4fd8;--hv-hover:#ff86e4;--hv-ink:#22001b}
:root[data-accent="green"]{--hv:#3dff8b;--hv-hover:#7affb0;--hv-ink:#00200c}
:root[data-accent]{--hv-soft:color-mix(in srgb,var(--hv) 14%,transparent)}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--bg);
  background-image:radial-gradient(ellipse 80% 50% at 70% -10%,var(--halo),transparent 70%),radial-gradient(var(--grid) 1px,transparent 1.2px);
  background-size:100% 100%,22px 22px; background-attachment:fixed;
  color:var(--ink);font:var(--fs)/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
}
a{color:inherit}
h1,h2,h3{margin:0;line-height:1.15;font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.mono,.num,.amt,.val{font-family:var(--f-display);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.nav{background:var(--nav);color:var(--nav-ink);width:224px;flex:none;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;border-right:1px solid rgba(90,216,255,.14)}
.brand{display:flex;align-items:center;gap:10px;font:700 21px/1 var(--f-display);letter-spacing:.14em;padding:4px 10px 20px;color:#fff}
.brand-mark{width:30px;height:30px;display:grid;place-items:center;color:var(--hv-ink);background:var(--hv);box-shadow:0 0 16px color-mix(in srgb,var(--hv) 50%,transparent);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
.brand small{font-size:10px;letter-spacing:.2em;color:#5ad8ff;display:block;margin-top:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;text-decoration:none;color:#aab5d0;font-weight:700;border-left:3px solid transparent;border-radius:0 4px 4px 0}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a.on{background:linear-gradient(90deg,rgba(90,216,255,.16),transparent);color:#fff;border-left-color:#5ad8ff}
.nav a.on svg{color:#5ad8ff}
.nav svg{width:20px;height:20px;flex:none}
.nav .fab{background:var(--hv);color:var(--hv-ink);justify-content:center;margin:0 0 14px;border:0;border-radius:0;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);box-shadow:none}
.nav .fab:hover{background:var(--hv-hover);color:var(--hv-ink)}
.nav .fab svg{color:var(--hv-ink)!important}
.nav .spacer{flex:1}
.nav .foot{font-size:12px;color:#7884a3;padding:8px 12px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#43e2a3;box-shadow:0 0 8px #43e2a3;flex:none}
main{flex:1;min-width:0;padding-block:30px 130px;padding-left:max(36px,env(safe-area-inset-left,0px));padding-right:max(36px,env(safe-area-inset-right,0px));max-width:1120px}

@media (max-width:820px){
  .shell{display:block}
  .nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;width:auto;flex-direction:row;justify-content:space-around;align-items:center;padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));z-index:20;gap:0;border-right:0;border-top:1px solid rgba(90,216,255,.18)}
  .brand,.nav .spacer,.nav .foot,.nav .desk{display:none}
  .nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;flex:1;text-align:center;justify-content:center;border-left:0;border-top:2px solid transparent;border-radius:0}
  .nav a.on{background:none;border-top-color:#5ad8ff}
  .nav .fab{order:3;flex:0 0 58px;height:58px;margin:-26px 4px 0;padding:0;clip-path:none;border-radius:16px;box-shadow:0 0 0 4px var(--nav),0 0 24px color-mix(in srgb,var(--hv) 50%,transparent)}
  .nav .fab span{display:none}
  .nav .fab svg{width:26px;height:26px}
  .nav .n-home{order:1}.nav .n-inv{order:2}.nav .n-cli{order:4}.nav .n-set{order:5}
  main{padding-block:18px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* ---------- panels ---------- */
.card{position:relative;background:var(--panel);border:1px solid var(--line);padding:20px;clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%)}
.card::after{content:"";position:absolute;top:0;right:0;width:var(--cut);height:var(--cut);background:linear-gradient(to bottom left,transparent calc(50% - .8px),var(--line) 50%,transparent calc(50% + .8px));pointer-events:none}
.card::before{content:"";position:absolute;left:-1px;bottom:-1px;width:16px;height:16px;border-left:2px solid var(--cy);border-bottom:2px solid var(--cy);opacity:.75;pointer-events:none}
.card + .card{margin-top:16px}
.grid > .card{margin-top:0}
.card h2{font-size:15px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-2);margin-bottom:14px}
.eyebrow{font:600 12px/1 var(--f-display);text-transform:uppercase;letter-spacing:.16em;color:var(--cy)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:clamp(26px,4vw,34px)}
.sub{color:var(--ink-2)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.muted{color:var(--ink-2)}
.small{font-size:.85em}
.mt{margin-top:16px}
.hide,[hidden]{display:none!important}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--line-2);background:var(--panel-2);font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;border-radius:var(--radius);transition:background .15s,box-shadow .15s,transform .1s}
.btn:hover{border-color:var(--cy);box-shadow:0 0 0 1px var(--cy-soft)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--hv);border-color:var(--hv);color:var(--hv-ink);box-shadow:var(--hv-glow);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);border-radius:0}
.btn.primary:hover{background:var(--hv-hover)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{box-shadow:none;background:var(--muted-soft)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:0 13px;font-size:.88em}
.btn.big{min-height:54px;padding:0 26px;font-size:1.06em}
.btn svg{width:18px;height:18px}
.icon-btn{width:40px;height:40px;border-radius:var(--radius);border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink-3)}
.icon-btn:hover{background:var(--bad-soft);color:var(--bad)}

label.f{display:flex;flex-direction:column;gap:6px;font-size:.82em;font-weight:700;color:var(--ink-2);letter-spacing:.02em}
.inp,select.inp,textarea.inp{width:100%;min-height:46px;padding:10px 12px;border-radius:var(--radius);border:1px solid var(--line-2);background:var(--bg-2);font-size:16px;color:var(--ink);font-weight:400;font-family:var(--f-body)}
textarea.inp{min-height:84px;resize:vertical}
.inp::placeholder{color:var(--ink-3)}
.inp:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 3px var(--cy-soft)}
.hint{font-size:12px;font-weight:700}
.hint.ok{color:var(--ok)} .hint.bad{color:var(--bad)}
.check{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;min-height:40px}
.check input{width:20px;height:20px;accent-color:var(--hv)}

/* status: colour + glyph + word, so state reads without colour too */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:3px;font:700 12px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;border:1px solid currentColor}
.chip i{font-style:normal;font-size:12px}
.st-draft{color:var(--ink-2);background:var(--muted-soft);border-style:dashed}
.st-sent{color:var(--cy);background:var(--cy-soft)}
.st-part{color:var(--warn);background:var(--warn-soft)}
.st-paid,.st-accepted{color:var(--ok);background:var(--ok-soft)}
.st-overdue,.st-declined{color:var(--bad);background:var(--bad-soft)}

.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--radius);overflow:hidden;background:var(--bg-2)}
.seg a,.seg button{padding:8px 16px;font-weight:700;text-decoration:none;border:0;background:transparent;cursor:pointer;color:var(--ink-2)}
.seg .on{background:var(--cy-soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--cy)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line-2);background:transparent;border-radius:3px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:.88em;color:var(--ink-2)}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- home console: one screen, one target ---------- */
.console{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
@media (min-width:1100px){.console{max-width:none;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:18px 28px;align-items:start}}
.c-left,.c-right{display:flex;flex-direction:column;gap:16px;min-width:0}
.strip{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.85em;color:var(--ink-2);border:1px dashed var(--line-2);padding:8px 12px;border-radius:var(--radius)}
.strip span{min-width:0}
@media (max-width:520px){.strip span{display:none}}
.strip b{font:600 11px var(--f-display);letter-spacing:.16em;color:var(--cy);text-transform:uppercase}
.strip .link{white-space:nowrap;margin-left:auto;background:none;border:0;color:var(--cy);font-weight:700;cursor:pointer;text-decoration:underline;padding:6px 0}
/* HUD bracket frame: cut corners + gradient edge */
.frame{position:relative;padding:18px 20px;background:var(--panel);--c:18px;clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c))}
.frame::before{content:"";position:absolute;inset:0;padding:1.5px;background:linear-gradient(135deg,var(--cy),color-mix(in srgb,var(--cy) 10%,transparent) 28%,color-mix(in srgb,var(--cy) 10%,transparent) 72%,var(--cy));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.frame .tag{position:absolute;top:0;left:50%;transform:translateX(-50%);padding:3px 14px 4px;font:600 10px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--bg);background:var(--cy);clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,8px 100%);white-space:nowrap}
/* clock */
.clock{text-align:center;padding-top:26px}
.clock .time{font:600 clamp(52px,15vw,78px)/1 var(--f-display);letter-spacing:.03em;font-variant-numeric:tabular-nums;margin:2px 0}
.clock .time small{font-size:.3em;letter-spacing:.12em;color:var(--ink-2);margin-left:6px}
.clock .date{color:var(--ink-2);font-weight:700}
.monthbar{margin-top:14px;display:flex;align-items:center;gap:10px;font:600 11px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.cells{flex:1;display:flex;gap:2px;min-width:0}
.cells i{flex:1;height:9px;background:var(--line)}
.cells i.p{background:color-mix(in srgb,var(--cy) 65%,transparent)}
.cells i.t{background:var(--hv);box-shadow:0 0 8px var(--hv)}
/* the core = the next action */
.coreblock{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.core{position:relative;width:min(300px,76vw);aspect-ratio:1}
.core svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.core .tk{stroke:var(--tone);opacity:.35}
.core .tk.mj{opacity:.9}
.core .thin{fill:none;stroke:var(--tone);opacity:.3}
.core .dash{fill:none;stroke:var(--tone);stroke-width:2;stroke-dasharray:2 7;opacity:.55}
.core .seg{fill:none;stroke:var(--line-2);stroke-width:7}
.core .seg.on{stroke:var(--tone);filter:drop-shadow(0 0 6px var(--tone))}
.core .chev{fill:var(--tone)}
.core-btn{position:absolute;left:50%;top:50%;width:58%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;color:var(--ink);border:2px solid var(--tone);padding:0;font:inherit;
  background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--tone) 30%,var(--panel)),var(--panel) 72%);
  box-shadow:0 0 0 7px color-mix(in srgb,var(--tone) 12%,transparent),0 0 42px color-mix(in srgb,var(--tone) 32%,transparent);transition:box-shadow .2s,transform .1s}
.core-btn:hover{box-shadow:0 0 0 9px color-mix(in srgb,var(--tone) 20%,transparent),0 0 56px color-mix(in srgb,var(--tone) 45%,transparent)}
.core-btn:active{transform:translate(-50%,-50%) scale(.98)}
.core-btn .verb{font:700 13px var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--tone-text)}
.core-btn .amt{font:600 clamp(24px,7vw,30px)/1.1 var(--f-display);margin:6px 0;font-variant-numeric:tabular-nums}
.core-btn .go{font-size:12px;font-weight:700;color:var(--ink-2)}
.t-bad{--tone:var(--bad);--tone-text:var(--bad)} .t-hv{--tone:var(--hv);--tone-text:var(--hv-text)}
.t-cy{--tone:var(--cy);--tone-text:var(--cy)} .t-ok{--tone:var(--ok);--tone-text:var(--ok)}
.core-cap h2{font-size:clamp(22px,5vw,26px);text-transform:none;letter-spacing:.01em;color:var(--ink);margin:4px 0 2px}
.core-cap p{margin:0;color:var(--ink-2)}
.core-cap .eyebrow{color:var(--tone-text)}
/* gauges */
.gauges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding-top:8px}
.gauge{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:inherit;padding:8px 2px;border-radius:var(--radius);text-align:center;min-width:0}
.gauge:hover{background:var(--cy-soft)}
.gauge .g{position:relative;width:min(88px,100%);aspect-ratio:1}
.gauge svg{width:100%;height:100%;display:block}
.gauge .g span{position:absolute;inset:0;display:grid;place-items:center;font:600 16px var(--f-display);font-variant-numeric:tabular-nums}
.gauge .lbl{font:600 11px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.gauge .sub{font-size:11px;color:var(--ink-3)}
/* status log */
.log{font:500 14px/1.5 var(--f-display);font-variant-numeric:tabular-nums;padding-top:28px}
.log .ln{display:flex;gap:8px;align-items:baseline;text-decoration:none;color:var(--ink-2);padding:5px 4px;border-radius:3px}
.log a.ln:hover{color:var(--ink);background:var(--cy-soft)}
.log .p{font-weight:700}
.log .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.log .dots{flex:1;border-bottom:1px dotted var(--line-2);min-width:12px;transform:translateY(-4px)}
.log .v{color:var(--ink);white-space:nowrap}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--bg-2);padding:7px 12px;border-radius:var(--radius);cursor:pointer;font-weight:700;color:var(--ink-2)}
.swatches button i{width:16px;height:16px;border-radius:50%;box-shadow:0 0 10px currentColor}
.swatches button.on{border-color:var(--hv);color:var(--ink);box-shadow:0 0 0 1px var(--hv)}

/* ---------- invoice editor: three slides ---------- */
.epager{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;align-items:flex-start;overscroll-behavior-x:contain;transition:height .25s ease}
.epager::-webkit-scrollbar{display:none}
.eslide{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;gap:16px;padding:0 1px}
.eslide .card + .card{margin-top:0}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.ccard,.tile,.qcard{font:inherit;color:var(--ink);text-align:left;cursor:pointer;border:1px solid var(--line-2);background:var(--bg-2);border-radius:var(--radius)}
.ccard{padding:12px 14px;min-height:66px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;position:relative}
.ccard b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard span{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard:hover,.tile:hover,.qcard:hover{border-color:var(--cy)}
.ccard.on{border-color:var(--cy);background:var(--cy-soft);box-shadow:0 0 0 1px var(--cy)}
.ccard.on::after{content:"✓";position:absolute;top:8px;right:10px;color:var(--cy);font-weight:700}
.ccard.new{border-style:dashed;color:var(--cy);font-weight:700}
.qcard{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-top:8px}
.qcard .qn{font:600 14px var(--f-display);color:var(--hv-text);white-space:nowrap}
.qcard .qd{flex:1;min-width:0}
.qcard .qd b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qcard .qd span{font-size:12px;color:var(--ink-2)}
.qcard .qa{font:600 16px var(--f-display);white-space:nowrap}
.lib-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.lib-tabs::-webkit-scrollbar{display:none}
.lib-tabs button{flex:none;border:1px solid var(--line-2);background:transparent;border-radius:3px;padding:7px 14px;font:600 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:var(--ink-2)}
.lib-tabs button.on{background:var(--hv-soft);border-color:var(--hv);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{position:relative;padding:12px;min-height:88px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.tile b{font-size:.95em;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .pr{font:600 15px var(--f-display);color:var(--hv-text);font-variant-numeric:tabular-nums}
.tile .pr small{font:400 12px var(--f-body);color:var(--ink-3)}
.tile .cnt{position:absolute;top:-8px;right:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--hv);color:var(--hv-ink);font:700 12px var(--f-display);display:grid;place-items:center;padding:0 7px}
.tile.add{border-style:dashed;color:var(--cy);justify-content:center;font-weight:700}
.wline{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.wline:first-child{border-top:0;padding-top:0}
.wl-top{display:flex;gap:4px;align-items:center}
.wl-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stepper{display:flex}
.stepper button{width:42px;min-height:46px;border:1px solid var(--line-2);background:var(--panel-2);font:700 20px/1 var(--f-display);cursor:pointer;color:var(--ink)}
.stepper button:first-child{border-radius:var(--radius) 0 0 var(--radius)}
.stepper button:last-child{border-radius:0 var(--radius) var(--radius) 0}
.stepper .inp{width:60px;text-align:center;border-radius:0;border-left:0;border-right:0;padding:8px 4px}
.wl-row select.inp{width:auto;min-width:74px}
.wl-row .pr{display:flex;align-items:center;gap:4px;color:var(--ink-2);font-weight:700}
.wl-row .pr .inp{width:108px}
.wl-row .gstc{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2);cursor:pointer}
.wl-row .gstc input{width:20px;height:20px;accent-color:var(--hv)}
.wl-row .lt{margin-left:auto;font:600 18px var(--f-display);font-variant-numeric:tabular-nums}
.icon-btn.star{font-size:20px;color:var(--ink-3)}
.icon-btn.star:hover,.icon-btn.star.on{color:var(--hv-text);background:var(--hv-soft)}
.esum{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line-2);border-radius:var(--radius);background:var(--bg-2);margin-bottom:14px}
.esum .big{font:600 30px var(--f-display);font-variant-numeric:tabular-nums}
.sticky-actions.wiz{justify-content:space-between;align-items:center;flex-wrap:nowrap}
.wiz .etotal{font:600 17px var(--f-display);font-variant-numeric:tabular-nums;text-align:center;min-width:0;white-space:nowrap}
.wiz .etotal small{display:block;font:400 11px var(--f-body);color:var(--ink-2)}
@media (max-width:520px){.wiz .btn.big{padding:0 16px;font-size:.95em}.wiz .btn{padding:0 12px}}

/* ---------- swipeable paperwork pages ---------- */
.ptabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border:0;background:none;cursor:pointer;font:600 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border-bottom:3px solid transparent;margin-bottom:-1px}
.ptab b{font:700 12px var(--f-display);min-width:22px;height:22px;padding:0 6px;display:inline-grid;place-items:center;border-radius:3px;background:var(--muted-soft);color:var(--ink-2)}
.ptab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tone,var(--cy))}
.ptab.t-bad{--tone:var(--bad)}.ptab.t-warn{--tone:var(--warn)}.ptab.t-cy{--tone:var(--cy)}.ptab.t-ok{--tone:var(--ok)}.ptab.t-q{--tone:var(--hv)}
.ptab.has b{background:color-mix(in srgb,var(--tone,var(--cy)) 18%,transparent);color:var(--tone,var(--cy))}
.ptab.t-q.has b{color:var(--hv-text)}
.pager{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;align-items:flex-start;transition:height .25s ease;overscroll-behavior-x:contain}
.pager::-webkit-scrollbar{display:none}
.ppage{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;padding:0 1px}
.phead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:2px 0 14px}
.phead .big{font:600 clamp(26px,5vw,32px) var(--f-display);font-variant-numeric:tabular-nums}
.phead .big.bad{color:var(--bad)} .phead .big.ok{color:var(--ok)}
.swipehint{display:none;font-size:12px;color:var(--ink-3);margin-left:auto}
@media (hover:none){.swipehint{display:inline}}
.pdots{display:flex;justify-content:center;gap:6px;margin-top:14px}
.pdots i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.pdots i.on{background:var(--cy);width:18px;border-radius:3px}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:104px minmax(0,1fr) auto 130px;gap:14px;align-items:center;padding:13px 8px;border-top:1px solid var(--line);text-decoration:none;cursor:pointer;position:relative}
.li:first-child{border-top:0}
.li:hover{background:var(--cy-soft)}
.li .num{font-weight:600;color:var(--ink-2);letter-spacing:.04em}
.li .who{min-width:0}
.li .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .when{font-size:.86em;color:var(--ink-2)}
.li .when.bad{color:var(--bad);font-weight:700}
.li .when.warn{color:var(--warn);font-weight:700}
.li .amt{font-weight:600;text-align:right;font-size:1.05em}
.li .amt small{display:block;font:400 11px var(--f-body);color:var(--ink-2)}
@media (max-width:560px){
  .li{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}
  .li .num{grid-column:1;font-size:.85em}
  .li .chip{grid-row:1;grid-column:2;justify-self:end}
  .li .who{grid-column:1}
  .li .amt{grid-column:2;grid-row:2}
}
.empty{text-align:center;padding:38px 16px;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font:600 19px var(--f-display);margin-bottom:6px}
.banner{display:flex;gap:14px;align-items:center;background:var(--hv-soft);border:1px solid color-mix(in srgb,var(--hv) 45%,transparent);padding:14px 16px;border-radius:var(--radius);margin-bottom:18px;flex-wrap:wrap}
.banner.example{background:var(--cy-soft);border-color:color-mix(in srgb,var(--cy) 40%,transparent)}
.banner a{color:var(--cy);font-weight:700}

/* ---------- editor ---------- */
.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;align-items:center;padding:12px 0;margin:-6px 0 14px;background:linear-gradient(var(--bg) 75%,transparent)}
.steps .st{flex:1;display:flex;flex-direction:column;gap:6px;border:0;background:none;padding:0;cursor:pointer;text-align:left;font:600 12px/1 var(--f-display);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);text-decoration:none}
.steps .st i{display:block;height:4px;background:var(--line-2);font-style:normal}
.steps .st.done{color:var(--ok)} .steps .st.done i{background:var(--ok);box-shadow:0 0 8px var(--ok-soft)}
.steps .st.now{color:var(--hv-text)} .steps .st.now i{background:var(--hv)}
.saved{font:600 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ok);display:inline-flex;align-items:center;gap:6px;opacity:.75;transition:opacity .3s}
.saved.flash{opacity:1}
.stepnum{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:10px;font:700 14px var(--f-display);color:var(--hv-ink);background:var(--hv);clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,0 100%);vertical-align:middle}
.stephead{display:flex;align-items:center;margin-bottom:16px;font:600 20px/1.2 var(--f-display)}
.stephead .muted{font:400 .8em var(--f-body);margin-left:10px}
details.more{margin-top:14px;border-top:1px dashed var(--line-2);padding-top:12px}
details.more summary{cursor:pointer;font-weight:700;color:var(--ink-2);list-style:none;display:flex;gap:4px 10px;align-items:center;flex-wrap:wrap}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸";color:var(--cy);transition:transform .15s}
details.more[open] summary::before{transform:rotate(90deg)}
details.more .grid{margin-top:14px}
.lines-head,.line{display:grid;grid-template-columns:minmax(0,1fr) 78px 92px 112px 56px 108px 40px;gap:8px;align-items:center}
.lines-head{font:600 11px var(--f-display);color:var(--ink-3);text-transform:uppercase;letter-spacing:.12em;padding:0 0 8px}
.line{padding:8px 0;border-top:1px solid var(--line)}
.line .lt{text-align:right;font-weight:600;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.line .gst{display:flex;justify-content:center}
.line .gst input{width:20px;height:20px;accent-color:var(--hv)}
.line .mlbl{display:none}
.lines.no-gst .gstcol{display:none}
.lines.no-gst .lines-head,.lines.no-gst .line{grid-template-columns:minmax(0,1fr) 78px 92px 112px 108px 40px}
@media (max-width:820px){
  .lines-head{display:none}
  .line,.lines.no-gst .line{grid-template-columns:repeat(6,minmax(0,1fr));row-gap:8px;padding:14px 0}
  .line .desc{grid-column:1/-1}
  .line .q,.line .u,.line .p{grid-column:span 2}
  .line .gst{grid-column:span 3;justify-content:flex-start;align-items:center}
  .lines.no-gst .line .lt{grid-column:span 5}
  .line .lt{grid-column:span 2;text-align:left;font-size:1.1em}
  .line .del{grid-column:span 1;justify-self:end}
  .line .mlbl{display:block;font:600 11px var(--f-display);color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
  .line .gst .mlbl{display:inline;margin:0 0 0 8px}
}
.totals{margin-left:auto;max-width:360px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;padding:5px 0;color:var(--ink-2)}
.totals div span:last-child{font-family:var(--f-display);color:var(--ink)}
.totals .grand{border-top:1px solid var(--line-2);margin-top:8px;padding-top:12px;font:600 24px var(--f-display);color:var(--ink)}
.totals .grand span:last-child{color:var(--hv-text)}
.sticky-actions{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding:22px 0 6px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;z-index:4}
@media (max-width:820px){.sticky-actions{bottom:70px}}
.terms{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.terms button{border:1px solid var(--line-2);background:transparent;border-radius:3px;padding:4px 11px;font-size:.8em;font-weight:700;cursor:pointer;color:var(--ink-2)}
.terms button.on{border-color:var(--hv);color:var(--hv-text);background:var(--hv-soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.docstate{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.docstate .big{font:600 22px var(--f-display)}

/* ---------- paper (always light; it's what the client receives) ---------- */
.paper-wrap{overflow-x:auto;padding-bottom:6px}
.paper{background:#fff;color:#141a26;width:100%;max-width:820px;min-width:600px;margin:0 auto;padding:46px 50px;position:relative;font:13.5px/1.5 var(--f-body);box-shadow:0 0 0 1px rgba(90,216,255,.25),0 20px 60px rgba(0,0,0,.35)}
.paper .p-head{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;padding-bottom:22px;border-bottom:3px solid #0d1426;position:relative}
.paper .p-head::after{content:"";position:absolute;left:0;bottom:-3px;width:90px;height:3px;background:#ffb020}
.paper .logo{max-height:70px;max-width:200px;display:block;margin-bottom:10px}
.paper .bizname{font:700 21px var(--f-display);letter-spacing:.01em}
.paper .doc-title{font:700 28px var(--f-display);letter-spacing:.12em;color:#0d1426;text-align:right;text-transform:uppercase}
.paper .meta{margin-top:10px;border-collapse:collapse;margin-left:auto}
.paper .meta td{padding:2px 0 2px 16px;text-align:right}
.paper .meta td:first-child{color:#5b6684}
.paper .parties{display:flex;gap:28px;margin:24px 0}
.paper .parties > div{flex:1}
.paper .lbl{font:700 11px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:#00658f;margin-bottom:4px}
.paper table.items{width:100%;border-collapse:collapse;margin-top:6px}
.paper table.items th{font:600 11px var(--f-display);letter-spacing:.1em;text-transform:uppercase;text-align:left;color:#5b6684;border-bottom:1.5px solid #141a26;padding:8px 6px}
.paper table.items td{padding:9px 6px;border-bottom:1px solid #e3e8f1;vertical-align:top}
.paper table.items .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.paper .free{font-size:11px;color:#5b6684}
.paper .ptotals{margin:14px 0 0 auto;width:300px;font-variant-numeric:tabular-nums}
.paper .ptotals div{display:flex;justify-content:space-between;padding:4px 6px}
.paper .ptotals .grand{background:#0d1426;color:#fff;font:700 16px var(--f-display);padding:10px 12px;margin-top:6px;letter-spacing:.03em}
.paper .ptotals .due{font-weight:800;font-size:15px;border-top:1.5px solid #141a26;margin-top:6px;padding-top:8px}
.paper .pay{margin-top:28px;background:#f2f5fa;border-left:3px solid #ffb020;padding:16px 18px;display:flex;gap:28px;flex-wrap:wrap}
.paper .pay table td{padding:1px 14px 1px 0}
.paper .pay table td:first-child{color:#5b6684}
.paper .notes{margin-top:22px;white-space:pre-wrap}
.paper .foot{margin-top:30px;padding-top:12px;border-top:1px solid #e3e8f1;font-size:12px;color:#5b6684;text-align:center}
.paper .sign{margin-top:34px;display:flex;gap:30px}
.paper .sign div{flex:1;border-top:1px solid #141a26;padding-top:4px;font-size:12px;color:#5b6684}
.paper .stamp{position:absolute;top:150px;right:60px;transform:rotate(-12deg);border:4px solid #08805a;color:#08805a;font:700 34px var(--f-display);letter-spacing:.16em;padding:4px 18px;opacity:.85}
.paper .stamp.over{border-color:#c8213f;color:#c8213f;font-size:26px}

dialog{border:1px solid var(--line-2);border-radius:var(--radius);padding:0;width:min(540px,calc(100vw - 24px));background:var(--panel);color:var(--ink);box-shadow:var(--glow),0 30px 80px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(4,8,18,.66);backdrop-filter:blur(3px)}
dialog form{padding:24px}
dialog h2{font-size:21px;margin-bottom:16px}
dialog .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.copybox{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.copybox .row{justify-content:space-between}
.copybox textarea{font:15px/1.5 var(--f-body);min-height:120px}

#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--panel-2);color:var(--ink);border:1px solid var(--line-2);box-shadow:var(--glow);padding:10px 12px 10px 18px;border-radius:var(--radius);font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100vw - 32px);display:flex;gap:14px;align-items:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast button{border:0;background:var(--hv);color:var(--hv-ink);font-weight:800;padding:6px 12px;border-radius:3px;cursor:pointer}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (max-width:820px){#toast{bottom:calc(168px + env(safe-area-inset-bottom,0px))}}

.pricelist .pl{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pricelist .pl:first-child{border-top:0}

/* calm mode + reduced motion: no glow, no animation */
:root[data-calm]{--glow:0 0 0 1px var(--line);--hv-glow:none}
:root[data-calm] .core-btn{box-shadow:0 0 0 2px color-mix(in srgb,var(--tone) 25%,transparent)}
:root[data-calm] .core .seg.on{filter:none}
:root[data-calm] *,:root[data-calm] *::before{transition:none!important;animation:none!important}
:root[data-calm] body{background-image:none}
@media (prefers-reduced-motion:reduce){*,*::before{transition:none!important;animation:none!important}}

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .nav,.no-print,#toast,#fx{display:none!important}
  main{padding:0;max-width:none}
  .paper-wrap{overflow:visible}
  .paper{box-shadow:none;padding:0;min-width:0;max-width:none}
  .paper .pay,.paper .ptotals .grand,.paper .p-head::after{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="shell">
  <nav class="nav" id="nav"></nav>
  <main id="view"></main>
</div>
<dialog id="modal"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =========================================================
   Docket — invoicing for Australian tradies
   Local-first: everything is stored in this browser.
   ========================================================= */

const KEY = 'docket.v1';
const DEFAULT = {
  settings: {
    businessName: '', tradingName: '', abn: '', gstRegistered: true, pricesIncGst: false,
    licence: '', phone: '', email: '', address: '',
    accountName: '', bsb: '', accountNumber: '', payId: '',
    paymentTermsDays: 14, quoteValidDays: 30, defaultRate: '95', chargeBy: 'hour',
    invoicePrefix: 'INV-', nextInvoice: 1, quotePrefix: 'Q-', nextQuote: 1,
    footerNote: 'Thanks for your business!', logo: '', cardLink: '', clientBase: '',
    monthlyGoal: '15000', bigText: false, calm: false, celebrate: true, accent: 'gold', display: 'auto', focusHome: false, reminderTone: 'friendly'
  },
  clients: [],
  docs: [],
  items: []
};
const UNITS = ['hr', 'ea', 'day', 'm', 'm²', 'lot', 'km'];

/* ---------- storage ---------- */
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) { /* fall through */ }
  return structuredClone(DEFAULT);
}
function migrate(d) {
  return {
    ...structuredClone(DEFAULT), ...d,
    settings: { ...DEFAULT.settings, ...(d.settings || {}) },
    clients: d.clients || [], docs: d.docs || [], items: d.items || []
  };
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Couldn’t save — browser storage is full. Try a smaller logo.'); }
}

/* ---------- helpers ---------- */

  let outstanding = 0, overdueSum = 0, overdueN = 0, paidMonth = 0, owedN = 0;
  const month = today().slice(0, 7);
  for (const d of inv) {
    const s = status(d), t = totals(d);
    if (s === 'sent' || s === 'part paid' || s === 'overdue') { outstanding += t.balance; owedN++; }
    if (s === 'overdue') { overdueSum += t.balance; overdueN++; }
    for (const p of d.payments) if ((p.date || '').slice(0, 7) === month) paidMonth += toCents(p.amount);
  }
  const q = basQuarter(today());
  let gst = 0;
  for (const d of inv) if (d.status !== 'draft' && d.gstReg && d.issueDate >= q.start && d.issueDate <= q.end) gst += totals(d).gst;
  const goal = Math.max(1, toCents(st.monthlyGoal) || 1500000), pct = paidMonth / goal;
  const now = new Date(), dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate(), day = now.getDate();
  const hr = now.getHours(), part = hr < 12 ? 'Morning' : hr < 17 ? 'Arvo' : 'Evening';
  const who = st.tradingName || st.businessName;
  const line = (href, tone, k, v) => `<${href ? `a href="${href}"` : 'div'} class="ln"><span class="p" style="color:var(--${tone})">›</span><span class="k">${esc(k)}</span><span class="dots"></span><span class="v">${esc(v)}</span></${href ? 'a' : 'div'}>`;
  const pageLine = key => { const pg = PAGES.find(p => p.key === key), docs = S.docs.filter(pg.match), counted = key === 'quotes' ? docs.filter(d => d.status === 'sent') : docs;
    return counted.length ? { n: counted.length, sum: counted.reduce((a, d) => a + (pg.kind === 'balance' ? totals(d).balance : totals(d).total), 0) } : null; };
  const L = { overdue: pageLine('overdue'), tosend: pageLine('tosend'), waiting: pageLine('waiting'), quotes: pageLine('quotes') };
  const logLines = [
    L.overdue && line('#/invoices/overdue', 'bad', `${L.overdue.n} overdue`, money(L.overdue.sum)),
    L.tosend && line('#/invoices/tosend', 'warn', `${L.tosend.n} ready to send`, money(L.tosend.sum)),
    L.waiting && line('#/invoices/waiting', 'cy', `${L.waiting.n} waiting on payment`, money(L.waiting.sum)),
    L.quotes && line('#/quotes', 'hv', `${plural(L.quotes.n, 'quote')} awaiting answer`, money(L.quotes.sum)),
    st.gstRegistered ? line('', 'ink-3', `GST ${q.label}`, money(gst)) : '',
    st.gstRegistered ? line('', 'ink-3', 'BAS due', q.due) : ''
  ].filter(Boolean).join('');

  return `<div class="console">
  ${S.example ? `<div class="strip"><b>Example data</b><span>Smithy’s Plumbing isn’t real. Have a play.</span><button class="link" data-act="examples-clear">Clear & start mine</button></div>`
    : (!st.businessName || !st.abn) ? `<div class="strip"><b>Setup</b><span>Add your business name, ABN and bank details.</span><a class="link" href="#/settings">Add details</a></div>` : ''}
  <div class="c-left">
    <section class="frame clock" aria-label="Date and time"><span class="tag">${esc(part)}${who ? ' · ' + esc(who) : ''}</span>
      <div class="time" id="clock">${clockText()}</div>
      <div class="date">${now.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
      <div class="monthbar" role="img" aria-label="Day ${day} of ${dim}, ${plural(dim - day, 'day')} left this month"><span>${now.toLocaleDateString('en-AU', { month: 'short' })}</span>
        <div class="cells">${Array.from({ length: dim }, (_, i) => `<i class="${i + 1 < day ? 'p' : i + 1 === day ? 't' : ''}"></i>`).join('')}</div><span>${dim - day}d left</span></div>
    </section>
    <section class="coreblock" aria-label="Next up">${coreHtml()}</section>
  </div>
  <div class="c-right">
    <section class="frame"><span class="tag">Money</span><div class="gauges">
      ${gaugeHtml('#/invoices/paid', 'This month', moneyShort(paidMonth), `${Math.round(pct * 100)}% of ${moneyShort(goal)} goal`, pct, 'hv')}
      ${gaugeHtml('#/invoices/overdue', 'Overdue', moneyShort(overdueSum), overdueN ? plural(overdueN, 'invoice') : 'None ✓', outstanding ? overdueSum / outstanding : 0, 'bad')}
      ${gaugeHtml('#/invoices/waiting', 'Owed', moneyShort(outstanding), plural(owedN, 'invoice'), 0, 'cy')}
    </div></section>
    <section class="frame log"><span class="tag">Status log</span>${logLines || '<div class="muted">All quiet. Nothing to report.</div>'}</section>
  </div>
</div>`;
}

function rowHtml(d) {
  const c = getClient(d.clientId), t = totals(d), due = dueInfo(d);
  const showBal = d.type === 'invoice' && t.paid > 0 && t.balance > 0;

/* ---------- views: list ---------- */
// Paperwork pages, ordered by urgency. Swipe (phone) or tap/arrow keys (desktop).
const PAGES = [
  { key: 'overdue', label: 'Overdue', tone: 'bad', kind: 'balance', word: 'overdue',
    match: d => d.type === 'invoice' && status(d) === 'overdue', sort: (a, b) => a.dueDate.localeCompare(b.dueDate),
    empty: ['Nothing overdue', 'Everyone’s paid up or still within terms. Nice.'] },
  { key: 'tosend', label: 'To send', tone: 'warn', kind: 'total', word: 'ready to send',
    match: d => d.type === 'invoice' && status(d) === 'draft', sort: (a, b) => (a.createdAt || 0) - (b.createdAt || 0),
    empty: ['Nothing to send', 'Finished a job? Tap + and log it while it’s fresh.'] },
  { key: 'waiting', label: 'Waiting', tone: 'cy', kind: 'balance', word: 'on its way',
    match: d => d.type === 'invoice' && (status(d) === 'sent' || status(d) === 'part paid'), sort: (a, b) => a.dueDate.localeCompare(b.dueDate),
    empty: ['Nothing waiting', 'Invoices you’ve sent that aren’t due yet show up here.'] },
  { key: 'paid', label: 'Paid', tone: 'ok', kind: 'total', word: 'paid',
    match: d => d.type === 'invoice' && status(d) === 'paid', sort: (a, b) => lastPaid(b).localeCompare(lastPaid(a)),
    empty: ['Nothing paid yet', 'When money lands, record it and it moves here.'] },
  { key: 'quotes', label: 'Quotes', tone: 'q', kind: 'open', word: 'waiting on an answer',
    match: d => d.type === 'quote', sort: (a, b) => qRank(a) - qRank(b) || (b.issueDate || '').localeCompare(a.issueDate || ''),
    empty: ['No quotes yet', 'Tap “New quote” to price up a job.'] }
];
const lastPaid = d => d.payments.map(p => p.date).sort().pop() || '';
const qRank = d => ({ sent: 0, draft: 1, accepted: 2, declined: 3 }[d.status] ?? 4);
let workPage = null;

function pageDocs(pg) {
  const q = listFilter.q.trim().toLowerCase();
  let docs = S.docs.filter(pg.match);
  if (q) docs = docs.filter(d => { const c = getClient(d.clientId); return [d.number, d.site, d.reference, c && c.name, c && c.contact].some(x => String(x || '').toLowerCase().includes(q)); });
  return docs.sort(pg.sort);
}
function pageBody(pg) {
  const docs = pageDocs(pg);
  if (!docs.length) return `<div class="card"><div class="empty"><b>${listFilter.q ? 'No matches' : pg.empty[0]}</b>${listFilter.q ? 'Try a different search.' : pg.empty[1]}</div></div>`;
  const counted = pg.kind === 'open' ? docs.filter(d => d.status === 'sent') : docs;
  const sum = counted.reduce((a, d) => a + (pg.kind === 'balance' ? totals(d).balance : totals(d).total), 0);
  return `<div class="phead"><span class="big ${pg.tone === 'bad' ? 'bad' : pg.tone === 'ok' ? 'ok' : ''}">${money(sum)}</span><span class="muted">${pg.word} · ${plural(counted.length, pg.key === 'quotes' ? 'quote' : 'invoice')}${counted.length !== docs.length ? ` (${docs.length} in total)` : ''}</span></div>
    <div class="card"><div class="list">${docs.map(rowHtml).join('')}</div></div>`;
}
function startPage(key) {
  if (key) return Math.max(0, PAGES.findIndex(p => p.key === key));
  if (workPage) return PAGES.findIndex(p => p.key === workPage);
  const i = PAGES.slice(0, 3).findIndex(p => S.docs.some(p.match));
  return i >= 0 ? i : 3;
}
function viewWork(key) {
  const start = startPage(key);
  workPage = PAGES[start].key;
  return `
  <div class="page-head">
    <div><div class="eyebrow">Paperwork</div><h1>Invoices & quotes</h1></div>
    <div class="row"><button class="btn" data-act="new" data-type="quote">${I.plus}New quote</button><button class="btn primary" data-act="new" data-type="invoice">${I.plus}New invoice</button></div>
  </div>
  <div class="row" style="margin-bottom:6px"><input class="inp" style="max-width:340px" type="search" id="f-search" placeholder="Search client, number, site…" value="${esc(listFilter.q)}" data-bind="search"><span class="swipehint">Swipe for more →</span></div>
  <div class="ptabs" role="tablist" id="ptabs">${PAGES.map((pg, i) => { const n = pageDocs(pg).length; return `<button type="button" role="tab" id="tab-${pg.key}" aria-controls="pg-${pg.key}" aria-selected="${i === start}" tabindex="${i === start ? 0 : -1}" class="ptab t-${pg.tone} ${n ? 'has' : ''}" data-act="page" data-i="${i}">${pg.label}<b>${n}</b></button>`; }).join('')}</div>
  <div class="pager" id="pager" data-start="${start}">${PAGES.map(pg => `<section class="ppage" id="pg-${pg.key}" role="tabpanel" aria-labelledby="tab-${pg.key}">${pageBody(pg)}</section>`).join('')}</div>
  <div class="pdots" aria-hidden="true">${PAGES.map((_, i) => `<i class="${i === start ? 'on' : ''}"></i>`).join('')}</div>`;
}
function pagerIndex() { const pg = document.getElementById('pager'); return pg ? Math.round(pg.scrollLeft / Math.max(1, pg.clientWidth)) : 0; }
function setPage(i, focusTab) {
  const pager = document.getElementById('pager'); if (!pager) return;
  i = Math.max(0, Math.min(PAGES.length - 1, i));
  workPage = PAGES[i].key;
  document.querySelectorAll('.ptab').forEach((t, k) => { t.setAttribute('aria-selected', k === i); t.tabIndex = k === i ? 0 : -1; });
  document.querySelectorAll('.pdots i').forEach((d, k) => d.classList.toggle('on', k === i));
  const tab = document.getElementById('tab-' + PAGES[i].key);
  tab.scrollIntoView({ block: 'nearest', inline: 'nearest' }); if (focusTab) tab.focus({ preventScroll: true });
  pager.style.height = pager.children[i].offsetHeight + 'px';
  const view = PAGES[i].key === 'quotes' ? 'quotes' : 'invoices';
  if (current.view !== view) { current.view = view; renderNav(); }
}
function goPage(i, focusTab) {
  const pager = document.getElementById('pager'); if (!pager) return;
  pager.scrollTo({ left: i * pager.clientWidth, behavior: S.settings.calm || matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  setPage(i, focusTab);
}
function setupPager() {
  const pager = document.getElementById('pager'); if (!pager) return;
  const start = Number(pager.dataset.start);
  pager.scrollLeft = start * pager.clientWidth;
  setPage(start);
  let raf;
  pager.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { const i = pagerIndex(); if (PAGES[i].key !== workPage) setPage(i); }); }, { passive: true });
  document.getElementById('ptabs').addEventListener('keydown', e => {
    const i = PAGES.findIndex(p => p.key === workPage);
    if (e.key === 'ArrowRight') { e.preventDefault(); goPage(i + 1, true); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); goPage(i - 1, true); }
  });
}
function refreshPages() {
  PAGES.forEach(pg => {
    const n = pageDocs(pg).length, tab = document.getElementById('tab-' + pg.key);
    tab.querySelector('b').textContent = n; tab.classList.toggle('has', !!n);
    document.getElementById('pg-' + pg.key).innerHTML = pageBody(pg);
  });
  setPage(PAGES.findIndex(p => p.key === workPage));
}
window.addEventListener('resize', () => { const pg = document.getElementById('pager'); if (pg) { const i = PAGES.findIndex(p => p.key === workPage); pg.scrollLeft = i * pg.clientWidth; setPage(i); } });

function editPager() { return document.getElementById('epager'); }
function syncEditUI(d) {
  const st = document.getElementById('steps'); if (st) st.innerHTML = stepsHtml(d);
  const prev = document.getElementById('e-prev');
  if (prev) { prev.disabled = editStep === 0; prev.style.visibility = editStep === 0 ? 'hidden' : ''; }
  const nx = document.getElementById('e-next'); if (nx) nx.textContent = nextLabel();
  const pg = editPager(); if (pg) pg.style.height = pg.children[editStep].offsetHeight + 'px';
}
function goEdit(i) {
  const pg = editPager(); if (!pg) return;
  editStep = Math.max(0, Math.min(2, i));
  pg.scrollTo({ left: editStep * pg.clientWidth, behavior: S.settings.calm || matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  syncEditUI(getDoc(current.id));
  window.scrollTo({ top: 0, behavior: 'auto' });
}
let editRO;
function setupEditPager() {
  const pg = editPager(); if (!pg) return;
  pg.scrollLeft = editStep * pg.clientWidth;
  syncEditUI(getDoc(current.id));
  let raf;
  pg.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => {
    const i = Math.round(pg.scrollLeft / Math.max(1, pg.clientWidth));
    if (i !== editStep) { editStep = i; syncEditUI(getDoc(current.id)); }
  }); }, { passive: true });
  if (editRO) editRO.disconnect();
  editRO = new ResizeObserver(() => { const p2 = editPager(); if (p2) p2.style.height = p2.children[editStep].offsetHeight + 'px'; });
  [...pg.children].forEach(c => editRO.observe(c));
}

  const payRows = [

  return `<article class="paper">
    ${!isQ && s === 'paid' ? '<div class="stamp">PAID</div>' : ''}
    ${!isQ && s === 'overdue' ? '<div class="stamp over">OVERDUE</div>' : ''}
    <div class="p-head">
      <div>
        ${st.logo ? `<img class="logo" src="${st.logo}" alt="">` : ''}

      </div>
      <div>
        <div class="doc-title">${title}</div>
        <table class="meta">
          <tr><td>${isQ ? 'Quote' : 'Invoice'} no.</td><td><b>${esc(d.number)}</b></td></tr>
          <tr><td>Date</td><td>${auDate(d.issueDate)}</td></tr>
          <tr><td>${isQ ? 'Valid until' : 'Due'}</td><td><b>${d.dueDate === d.issueDate && !isQ ? 'On receipt' : auDate(d.dueDate)}</b></td></tr>
          ${d.reference ? `<tr><td>Your ref</td><td>${esc(d.reference)}</td></tr>` : ''}
        </table>
      </div>
    </div>
    <div class="parties">
      <div><div class="lbl">${isQ ? 'Prepared for' : 'Bill to'}</div>
        <b>${esc(c.name || '—')}</b>${c.contact ? `<br>Attn: ${esc(c.contact)}` : ''}${c.address ? `<br>${nl2br(c.address)}` : ''}${c.abn ? `<br>ABN ${esc(abnFmt(c.abn))}` : ''}
      </div>
      ${d.site ? `<div><div class="lbl">Job site</div>${nl2br(d.site)}</div>` : ''}
    </div>
    <table class="items">
      <thead><tr><th>Description</th><th class="n">Qty</th><th class="n">Unit price${priceCol ? ' ' + priceCol : ''}</th><th class="n">Amount</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4" style="color:#999">No items</td></tr>'}</tbody>
    </table>
    <div class="ptotals">${totalsRows}</div>
    ${!isQ && d.gstReg && t.hasFree ? '<div class="free" style="text-align:right;margin-top:4px">Items marked GST-free have no GST included.</div>' : ''}
    ${!d.gstReg ? '<div class="free" style="text-align:right;margin-top:4px">No GST has been charged. Supplier is not registered for GST.</div>' : ''}
    ${d.notes ? `<div class="notes"><div class="lbl">Notes</div>${esc(d.notes)}</div>` : ''}
    ${isQ
      ? `<div class="pay"><div><div class="lbl">To accept</div>Reply to this quote or sign below. This quote is valid until ${auDate(d.dueDate)}.</div></div>
         <div class="sign"><div>Signed</div><div>Name</div><div>Date</div></div>`
      : `<div class="pay"><div><div class="lbl">How to pay</div><table>${payRows}</table></div>
         <div><div class="lbl">Amount due</div><div style="font-size:22px;font-weight:800">${money(t.balance)}</div><div>${d.dueDate === d.issueDate ? 'Due on receipt' : 'by ' + longDate(d.dueDate)}</div></div></div>`}
    ${st.footerNote ? `<div class="foot">${esc(st.footerNote)}</div>` : ''}
  </article>`;
}

/* ---------- modal ---------- */
function openModal(title, body, submitLabel, onSubmit) {
  const m = document.getElementById('modal');
  m.innerHTML = `<form method="dialog"><h2>${title}</h2>${body}<div class="actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">${submitLabel}</button></div></form>`;
  const form = m.querySelector('form');
  form.addEventListener('submit', e => {
    if (e.submitter && e.submitter.value === 'cancel') return;
    e.preventDefault();
    if (!form.reportValidity()) return;
    const data = Object.fromEntries(new FormData(form).entries());
    if (onSubmit(data, form) !== false) m.close();
  });
  m.showModal();
  const first = form.querySelector('input,select,textarea'); if (first) first.focus();
  return m;
}
// In-page confirmation (browser confirm()/prompt() are blocked in some viewers)
function ask(title, message, okLabel, onOk, typeWord) {
  openModal(esc(title), `<p style="margin:0">${message}</p>${typeWord ? `<label class="f mt">Type ${typeWord} to confirm<input class="inp" name="word" id="ask-word" autocomplete="off" required></label>` : ''}`,
    okLabel, data => {
      if (typeWord && String(data.word || '').trim().toUpperCase() !== typeWord) { toast(`Type ${typeWord} to confirm`); return false; }
      setTimeout(onOk, 0);
    });
  const ok = document.querySelector('#modal button[value=ok]');
  ok.style.background = 'var(--bad)'; ok.style.borderColor = 'var(--bad)'; ok.style.color = '#fff';
}
function copyText(text, el) {
  const done = () => toast('Copied');
  try {
    navigator.clipboard.writeText(text).then(done, () => { if (el) { el.focus(); el.select(); } toast('Select the text and copy it'); });
  } catch (e) { if (el) { el.focus(); el.select(); } toast('Select the text and copy it'); }
}
// Show text the person can copy (used where downloads or mail links are blocked)
function showCopy(title, intro, blocks) {
  const m = openModal(esc(title), `<p class="muted small" style="margin:0">${intro}</p>` + blocks.map((b, i) => `
    <div class="copybox"><div class="row"><b class="small">${esc(b.label)}</b><button type="button" class="btn sm" data-copy="${i}">Copy</button></div>
    ${b.multi ? `<textarea class="inp" id="copy-${i}" readonly>${esc(b.text)}</textarea>` : `<input class="inp" id="copy-${i}" readonly value="${esc(b.text)}">`}</div>`).join(''), 'Done', () => {});
  m.querySelector('button[value=cancel]').classList.add('hide');
  m.querySelectorAll('[data-copy]').forEach(btn => btn.addEventListener('click', () => { const i = btn.dataset.copy; copyText(blocks[i].text, document.getElementById('copy-' + i)); }));
}
const EMBEDDED = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

function clientModal(onDone) {
  openModal('New client', clientFields(), 'Add client', data => {
    const c = { id: uid(), name: data.name.trim(), contact: data.contact.trim(), email: data.email.trim(), phone: data.phone.trim(), address: data.address.trim(), abn: abnClean(data.abn) };
    if (c.abn && !abnValid(c.abn)) { toast('That ABN doesn’t check out — fix it or leave it blank'); return false; }
    S.clients.push(c); save(); toast('Client added');
    onDone && onDone(c);
  });
}

function celebrate() {
  if (!S.settings.celebrate || S.settings.calm || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.createElement('canvas'); cv.id = 'fx'; document.body.appendChild(cv);
  const W = innerWidth, H = innerHeight, dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const cols = ['#ffb627', '#5ad8ff', '#43e2a3', '#ffffff'];
  const ps = Array.from({ length: 110 }, () => ({ x: W / 2, y: H * .42, vx: (Math.random() - .5) * 15, vy: -Math.random() * 13 - 3, s: Math.random() * 7 + 3, c: cols[Math.random() * 4 | 0], r: Math.random() * 6, vr: (Math.random() - .5) * .4 }));
  let f = 0;
  (function frame() {
    f++; g.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.vy += .38; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.globalAlpha = Math.max(0, 1 - f / 90); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore();
    }
    if (f < 90) requestAnimationFrame(frame); else cv.remove();
  })();
}

document.addEventListener('input', e => {
  const t = e.target, b = t.dataset.bind;
  if (!b) return;
  const val = t.type === 'checkbox' ? t.checked : t.value;

  if (b === 'set') {
    flashSaved();
    const k = t.dataset.key;
    let v = val;
    if (k === 'abn') v = abnClean(val);
    if (k === 'nextInvoice' || k === 'nextQuote') v = Math.max(1, parseInt(val, 10) || 1);
    if (k === 'paymentTermsDays' || k === 'quoteValidDays') v = Math.max(0, parseInt(val, 10) || 0);
    S.settings[k] = v; save();
    if (k === 'abn') updateAbnHint(t);
    if (t.type === 'checkbox') route();
    if (k === 'monthlyGoal') S.settings.monthlyGoal = String(num(val));
    return;
  }
  if (b === 'search') { listFilter.q = val; refreshPages(); return; }
  if (b === 'csearch') { clientQuery = val; const d0 = getDoc(current.id); document.getElementById('cgrid').innerHTML = clientCardsHtml(d0); syncEditUI(d0); return; }

  const d = getDoc(current.id);
  if (!d) return;
  if (b === 'doc') {
    const k = t.dataset.key;
    if (k === 'clientId' && val === '__new') {
      t.value = d.clientId;
      clientModal(c => { d.clientId = c.id; save(); refreshWho(d); });
      return;
    }
    d[k] = val;
    if (k === 'issueDate' && d.terms != null && val) { d.dueDate = addDays(val, d.terms); document.getElementById('duedate').value = d.dueDate; }
    if (k === 'dueDate') { d.terms = null; document.querySelectorAll('#terms button').forEach(x => x.classList.remove('on')); }
    save();
    if (k === 'incGst') { rerenderEditor(); return; }
    const tt = document.getElementById('totals'); if (tt) tt.innerHTML = editorTotals(d);
    afterEdit(d);
    return;
  }
  if (b === 'line') {
    const id = t.closest('[data-line]').dataset.line;
    const l = d.lines.find(x => x.id === id);
    l[t.dataset.key] = val; if (t.dataset.key !== 'qty') delete l.lib; save();
    document.getElementById('lt-' + id).textContent = money(lineCents(l));
    document.getElementById('totals').innerHTML = editorTotals(d);
    afterEdit(d);
    return;
  }
});

  const file = t.files[0];
  if (act === 'logo') {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 400 / img.width, 160 / img.height);
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      S.settings.logo = cv.toDataURL('image/png'); save(); route(); toast('Logo saved');
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => toast('Couldn’t read that image');
    img.src = URL.createObjectURL(file);
  }
  if (act === 'restore') {
    file.text().then(txt => {
      const data = JSON.parse(txt);
      if (!data.settings || !Array.isArray(data.docs)) throw new Error('bad');
      ask('Restore backup?', `It has ${data.docs.length} documents and ${(data.clients || []).length} clients, and replaces what’s on this device.`, 'Restore', () => {
        S = migrate(data); save(); go('/'); toast('Backup restored');
      });
    }).catch(() => toast('That file isn’t a Docket backup'));
  }
  t.value = '';
});

/* ---------- client link (invoice packed into the URL, nothing stored online) ---------- */
function defaultClientBase() {
  if (/\.github\.io$/.test(location.hostname)) return new URL('view.html', location.href).href.split('#')[0];
  return 'https://ibssqld-star.github.io/ADHDtracking/invoice/view.html';
}
const clientBase = () => (S.settings.clientBase || '').trim() || defaultClientBase();
function b64url(bytes) { let s = ''; for (const b of bytes) s += String.fromCharCode(b); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
async function clientLink(d) {
  const st = S.settings, c = getClient(d.clientId) || {}, t = totals(d), o = v => v || undefined;
  const D = {
    v: 1, t: d.type === 'quote' ? 'q' : 'i', n: d.number, i: d.issueDate, d: d.dueDate, r: o(d.reference), s: o(d.site), no: o(d.notes),
    g: d.gstReg ? 1 : 0, x: d.incGst ? 1 : 0, p: o(t.paid), f: o(st.footerNote),
    b: { n: st.businessName, t: o(st.tradingName), a: o(st.abn), l: o(st.licence), p: o(st.phone), e: o(st.email), ad: o(st.address),
      an: o(st.accountName), bsb: o(st.bsb), ac: o(st.accountNumber), pid: o(st.payId), card: /^https:\/\//.test(st.cardLink || '') ? st.cardLink.trim() : undefined },
    c: { n: c.name, ct: o(c.contact), ad: o(c.address), a: o(c.abn) },
    l: d.lines.filter(l => l.desc || num(l.price)).map(l => [l.desc, String(num(l.qty)), l.unit, String(num(l.price)), l.gst ? 1 : 0])
  };
  const raw = new TextEncoder().encode(JSON.stringify(D));
  let frag;
  try {
    const z = new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    frag = 'z.' + b64url(new Uint8Array(await new Response(z).arrayBuffer()));
  } catch (e) { frag = 'j.' + b64url(raw); }
  return clientBase() + '#' + frag;
}
